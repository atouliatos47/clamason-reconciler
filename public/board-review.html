<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clamason — Board Review</title>
<meta name="theme-color" content="#243547">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; display: flex; }

  .sidebar { width: 220px; flex-shrink: 0; background: #243547; min-height: 100vh; display: flex; flex-direction: column; padding: 24px 0; border-right: 3px solid #95C11F; }
  .sidebar-brand { padding: 0 24px 20px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .sidebar-logo { width: 100%; height: auto; display: block; }
  .sidebar-brand p { color: #8fa0b3; font-size: 11px; margin-top: 10px; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item { color: #C7CFD6; font-size: 13px; text-decoration: none; padding: 11px 24px; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
  .nav-item.active { background: rgba(149,193,31,0.14); color: #95C11F; border-left-color: #95C11F; font-weight: bold; }
  .sidebar-footer { color: #55647a; font-size: 10px; padding: 16px 24px 0; }

  .main { flex: 1; min-width: 0; }
  .page-header { padding: 20px 32px; background: white; border-bottom: 1px solid #e2e5ea; display: flex; justify-content: space-between; align-items: center; }
  .page-header h1 { color: #243547; font-size: 17px; font-weight: bold; }
  .page-header p { color: #888; font-size: 11.5px; margin-top: 3px; }
  select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 12.5px; }
  .print-btn { padding: 8px 16px; background: #243547; color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; margin-left: 8px; }
  .print-btn:hover { background: #95C11F; color: #243547; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .empty-note, .error-box { background: white; border-radius: 10px; padding: 24px; text-align: center; color: #888; font-size: 13px; display: none; }
  .error-box { background: #fee2e2; border: 1px solid #dc2626; color: #dc2626; text-align: left; }

  .slide { background: white; border-radius: 10px; padding: 22px 26px; }
  .slide-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; border-bottom: 3px solid #243547; margin-bottom: 18px; }
  .slide-head h2 { font-size: 21px; color: #243547; }
  .slide-head .period { font-size: 12px; color: #666; }
  .slide-head .period strong { color: #243547; }

  .cols { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; }
  .col { padding: 0 14px; }
  .col + .col { border-left: 1px solid #e8eaee; }
  .dept { color: #fff; padding: 9px 12px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
  .dept span.name { font-size: 13px; font-weight: bold; letter-spacing: 0.7px; }
  .dept span.num { font-size: 9.5px; opacity: 0.75; font-family: monospace; }
  .dept.production { background: #3d6491; }
  .dept.toolroom { background: #bf7d2c; }
  .dept.maintenance { background: #2e6b4f; }

  .chart-label { display: flex; justify-content: space-between; font-size: 9px; color: #999; margin: 14px 0 5px; letter-spacing: 0.4px; text-transform: uppercase; }
  .chart-label .hrs { color: #555; font-weight: bold; }
  .chart-box { border: 1px solid #e8eaee; border-radius: 5px; padding: 8px; }
  .chart-wrap { position: relative; height: 155px; }
  .chart-wrap.short { height: 135px; }

  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .gauge-label { font-size: 9px; color: #999; margin-bottom: 5px; letter-spacing: 0.4px; text-transform: uppercase; }
  .gauge-box { border: 1px solid #e8eaee; border-radius: 5px; padding: 10px; display: flex; align-items: center; gap: 9px; }
  .gauge-ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .gauge-note { font-size: 9.5px; color: #666; line-height: 1.55; }

  .unclassified { margin-top: 18px; padding: 11px 14px; background: #fffbeb; border: 1px solid #fcd34d; border-left: 4px solid #f59e0b; border-radius: 4px; font-size: 11.5px; color: #92400e; line-height: 1.5; display: none; }
  .slide-foot { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 11px; border-top: 1px solid #e8eaee; font-size: 9.5px; color: #aaa; }

  @media print {
    .sidebar, .page-header, .print-btn { display: none; }
    body { background: white; }
    .container { max-width: none; padding: 0; }
    .slide { border-radius: 0; padding: 12px; }
    @page { size: A4 landscape; margin: 8mm; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <img class="sidebar-logo" src="/clamason-logo.png" alt="Clamason">
    <p>Maintenance Reconciler</p>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="/">Monthly Check</a>
    <a class="nav-item" href="/dashboard">Trend Dashboard</a>
    <a class="nav-item active" href="/board-review">Board Review</a>
    <a class="nav-item" href="/daily">Daily Check</a>
    <a class="nav-item" href="/daily-trend">Daily Trend</a>
    <a class="nav-item" href="/sfc-daily">SFC Daily</a>
    <a class="nav-item" href="/sfc-daily-trend">SFC Trend</a>
  </nav>
  <div class="sidebar-footer">Internal Tool</div>
</div>

<div class="main">

<div class="page-header">
  <div>
    <h1>Board Review</h1>
    <p>Monthly performance slide, built from a saved Monthly Check</p>
  </div>
  <div>
    <select id="period-select" onchange="selectPeriod(this.value)"></select>
    <button class="print-btn" onclick="window.print()">Print / PDF</button>
  </div>
</div>

<div class="container">
  <div class="error-box" id="error-box"></div>
  <div class="empty-note" id="empty-note">
    No saved months yet — run a <a href="/">Monthly Check</a> and press Save to Trend Dashboard.
  </div>
  <div class="slide" id="slide" style="display:none;"></div>
</div>

</div>

<script>
let RUNS = [];
let current = null;
const charts = [];

const fmt = (v, d = 1) => (v === null || v === undefined) ? '–' : Number(v).toFixed(d);
const hrs = (v, d = 1) => (v === null || v === undefined) ? '–' : Number(v).toFixed(d) + 'h';

// Kept in step with config.py. Display-only: it decides which reason
// rows appear in which department's chart. Every hours total on this
// page is categorised server-side, so a code missing from these lists
// shows up in the unclassified strip rather than being miscounted.
const FAULT_CODES = ['FAULT - PRESS', 'FAULT-FEEDER/DECOILER/STR',
                     'FAULT-FEEDER/DECOILER/STRAIGHTENER', 'FAULT-SHAKER/CONVEYOR'];
const TOOLROOM_CODES = ['TOOL FAILURE - PRODUCTION', 'TOOL FAILURE - SET UP',
                        'TOOL UNAVAILABLE', 'WASTE IN THE TOOL'];
const PLANNED_CODES = ['PLANNED OFFLINE', 'NO PRODUCTION PLANNED'];

function categorise(reason) {
  const r = (reason || '').toUpperCase().trim();
  if (FAULT_CODES.includes(r)) return 'fault';
  if (TOOLROOM_CODES.includes(r)) return 'tool';
  if (PLANNED_CODES.includes(r)) return 'planned';
  return 'production';
}

async function load() {
  try {
    const res = await fetch('/api/trend');
    const json = await res.json();
    if (json.error) return showError(json.error);
    RUNS = json.runs || json || [];
    if (!RUNS.length) {
      document.getElementById('empty-note').style.display = 'block';
      return;
    }
    const sel = document.getElementById('period-select');
    // Newest first — that's the month you came here to present.
    sel.innerHTML = RUNS.slice().reverse()
      .map((r, i) => `<option value="${RUNS.length - 1 - i}">${r.period_label || r.period}</option>`).join('');
    selectPeriod(RUNS.length - 1);
  } catch (e) {
    showError(e.message);
  }
}

function showError(msg) {
  const b = document.getElementById('error-box');
  b.textContent = msg;
  b.style.display = 'block';
}

function selectPeriod(i) {
  current = RUNS[Number(i)];
  render();
}

// Aggregate each department's reason codes across every machine. The
// per-machine reasons dicts are stored precisely so this can be rebuilt
// from a saved run without re-uploading the source workbook.
function reasonTotals(mb, cat) {
  const totals = {};
  mb.forEach(m => {
    Object.entries(m.reasons || {}).forEach(([reason, h]) => {
      if (categorise(reason) === cat) totals[reason] = (totals[reason] || 0) + h;
    });
  });
  return Object.entries(totals).sort((a, b) => b[1] - a[1]);
}

function unclassifiedCodes(mb) {
  // Nothing here is "unclassified" today — production is the residual
  // bucket. This exists for the incoming SFC code list: when a new code
  // appears it lands in production silently, so any production-bucket
  // code that isn't one we've seen before gets surfaced for assignment
  // rather than quietly diluting the numbers.
  const known = new Set([...FAULT_CODES, ...TOOLROOM_CODES, ...PLANNED_CODES,
    'CHANGEOVER', 'COIL CHANGEOVER', 'LUNCH / BREAK / MEETING', 'ADJUSTMENTS',
    'LABOUR UNAVAILABLE', 'MATERIAL UNAVAILABLE', 'MATERIAL PROBLEM',
    'WAITING QUALITY PASS OFF', 'QUALITY FAIL - VISUAL', 'QUALITY FAIL - DIMENSION',
    'PLANNED SERVICE', 'PARTS PRESET REACHED', 'IDLE', 'WASTE BIN REMOVAL',
    'MORNING SHIFT START UP', 'LUBRICATION/OIL REFILL', 'TOOL TRIAL',
    'WAITING FOR PACKAGING', 'SHIFT CHANGE', 'BIN CHANGEOVER']);
  const found = {};
  mb.forEach(m => Object.entries(m.reasons || {}).forEach(([reason, h]) => {
    if (!known.has(reason.toUpperCase().trim())) found[reason] = (found[reason] || 0) + h;
  }));
  return Object.entries(found).sort((a, b) => b[1] - a[1]);
}

function render() {
  const d = current;
  const mb = d.machine_breakdown || [];
  charts.forEach(c => c.destroy());
  charts.length = 0;

  const siteFault = mb.reduce((s, m) => s + (m.fault_hrs || 0), 0);
  const siteTool = mb.reduce((s, m) => s + (m.tool_hrs || 0), 0);
  const siteProd = mb.reduce((s, m) => s + (m.production_hrs || 0), 0);

  const top5 = (cat) => mb.slice().sort((a, b) => (b[cat] || 0) - (a[cat] || 0)).slice(0, 5);

  const col = (cls, name, num, cat, siteHrs, reasonLabel, gauges) => `
    <div class="col">
      <div class="dept ${cls}"><span class="name">${name}</span><span class="num">DEPT / ${num}</span></div>
      <div class="chart-label"><span>Downtime Pareto</span><span>Top 5 presses</span></div>
      <div class="chart-box"><div class="chart-wrap"><canvas id="p-${cls}"></canvas></div></div>
      <div class="chart-label"><span>${reasonLabel}</span><span class="hrs">${siteHrs.toFixed(1)}h</span></div>
      <div class="chart-box"><div class="chart-wrap short"><canvas id="r-${cls}"></canvas></div></div>
      <div class="gauges">${gauges}</div>
    </div>`;

  const gauge = (id, label, note) => `
    <div><div class="gauge-label">${label}</div>
      <div class="gauge-box"><div class="gauge-ring"><canvas id="${id}"></canvas></div>
      <div class="gauge-note">${note}</div></div></div>`;

  const oeeGauges =
    gauge('g-oee', 'OEE', d.oee_pct == null ? 'not uploaded' : `target 70%<br>${d.oee_week_count} weeks`) +
    gauge('g-prod', 'Production downtime', `${siteProd.toFixed(0)}h<br>unplanned`);

  const toolGauges =
    gauge('g-woT', 'Agility (tool WOs)', `vs ${mb.reduce((s, m) => s + (m.tool_events || 0), 0)} SFC events`) +
    gauge('g-tool', 'Downtime (SFC)', `${siteTool.toFixed(0)}h<br>tool-related`);

  const mttrNote = d.mtbf_mttr_hrs == null ? 'not uploaded'
    : `wait ${fmt(d.mtbf_wait_hrs, 1)}h<br>${d.mtbf_jobs} jobs`;
  const maintGauges =
    gauge('g-mttr', 'MTTR', mttrNote) +
    gauge('g-fault', 'Downtime (SFC)', `Agility ${hrs(d.agility_maintenance_hrs)}<br>${fmt(100 - d.gap_pct, 1)}% covered`);

  document.getElementById('slide').innerHTML = `
    <div class="slide-head">
      <h2>Monthly Performance Review</h2>
      <div class="period">Period: <strong>${d.period_label || d.period}</strong> · ${mb.length} presses</div>
    </div>
    <div class="cols">
      ${col('production', 'PRODUCTION', '01', 'production_hrs', siteProd, 'Unplanned downtime — reason codes', oeeGauges)}
      ${col('toolroom', 'TOOLROOM', '02', 'tool_hrs', siteTool, 'Tool downtime — reason codes', toolGauges)}
      ${col('maintenance', 'MAINTENANCE', '03', 'fault_hrs', siteFault, 'Fault downtime — reason codes', maintGauges)}
    </div>
    <div class="unclassified" id="unclassified"></div>
    <div class="slide-foot">
      <span>Clamason — internal use only</span>
      <span>Source: ShopFloorConnect · Agility CMMS${d.oee_pct != null ? ' · SFC OEE' : ''}</span>
    </div>`;
  document.getElementById('slide').style.display = 'block';

  pareto('p-production', top5('production_hrs'), 'production_hrs', '#3d6491');
  pareto('p-toolroom', top5('tool_hrs'), 'tool_hrs', '#bf7d2c');
  pareto('p-maintenance', top5('fault_hrs'), 'fault_hrs', '#2e6b4f');

  reasonBars('r-production', reasonTotals(mb, 'production'), '#3d6491', siteProd);
  reasonBars('r-toolroom', reasonTotals(mb, 'tool'), '#bf7d2c', siteTool);
  reasonBars('r-maintenance', reasonTotals(mb, 'fault'), '#2e6b4f', siteFault);

  ring('g-oee', d.oee_pct, d.oee_pct == null ? '–' : fmt(d.oee_pct, 0) + '%', '#3d6491');
  ring('g-prod', 100, siteProd.toFixed(0) + 'h', '#c0392b');
  ring('g-woT', 100, String(mb.reduce((s, m) => s + (m.wo_count || 0), 0)), '#bf7d2c');
  ring('g-tool', 100, siteTool.toFixed(0) + 'h', '#c0392b');
  ring('g-mttr', 100, d.mtbf_mttr_hrs == null ? '–' : fmt(d.mtbf_mttr_hrs, 1) + 'h', '#2e6b4f');
  ring('g-fault', d.gap_pct, siteFault.toFixed(0) + 'h', '#c0392b');

  const unk = unclassifiedCodes(mb);
  const ubox = document.getElementById('unclassified');
  if (unk.length) {
    ubox.innerHTML = `<strong>Unclassified reason codes — currently counted as production:</strong> ` +
      unk.map(([r, h]) => `${r} (${h.toFixed(1)}h)`).join(', ') +
      `. Assign these in config.py so they reach the right department.`;
    ubox.style.display = 'block';
  } else {
    ubox.style.display = 'none';
  }
}

const MUTED = '#999', RED = '#c0392b';

function pareto(id, rows, key, colour) {
  const data = rows.map(r => r[key] || 0);
  const total = data.reduce((a, b) => a + b, 0);
  let run = 0;
  const cum = data.map(v => { run += v; return total ? Math.round(run / total * 1000) / 10 : 0; });
  charts.push(new Chart(document.getElementById(id), {
    data: {
      labels: rows.map((r, i) => [cum[i].toFixed(0) + '%', r.machine]),
      datasets: [
        { type: 'bar', data, backgroundColor: colour, borderRadius: 2, maxBarThickness: 34, order: 2 },
        { type: 'line', data: cum, borderColor: RED, borderWidth: 1.4, pointRadius: 2,
          pointBackgroundColor: RED, yAxisID: 'y1', order: 1 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 8 } },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => c.dataset.type === 'line'
          ? 'cumulative ' + c.parsed.y.toFixed(1) + '%' : c.parsed.y.toFixed(1) + 'h' } } },
      scales: {
        x: { ticks: { color: MUTED, font: { size: 8 } }, grid: { display: false } },
        y: { ticks: { color: MUTED, font: { size: 8 }, callback: v => v + 'h' },
             grid: { color: 'rgba(0,0,0,0.05)' }, beginAtZero: true },
        y1: { position: 'right', min: 0, max: 100, grid: { display: false },
              ticks: { color: MUTED, font: { size: 8 }, stepSize: 50, callback: v => v + '%' } },
      },
    },
  }));
}

function reasonBars(id, entries, colour, total) {
  // Top 5 plus an explicit "Other" — dropping the tail would make the
  // column look smaller than the department's actual downtime.
  const top = entries.slice(0, 5);
  const rest = entries.slice(5).reduce((s, e) => s + e[1], 0);
  const labels = top.map(e => e[0].length > 16 ? e[0].slice(0, 15) + '…' : e[0]);
  const data = top.map(e => e[1]);
  if (rest > 0.05) { labels.push('Other'); data.push(rest); }
  charts.push(new Chart(document.getElementById(id), {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colour, borderRadius: 2, maxBarThickness: 40 }] },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 8 } },
      plugins: { legend: { display: false },
        tooltip: { callbacks: {
          title: c => entries[c[0].dataIndex] ? entries[c[0].dataIndex][0] : 'Other',
          label: c => c.parsed.y.toFixed(1) + 'h' + (total ? ` (${(c.parsed.y / total * 100).toFixed(0)}%)` : '') } } },
      scales: {
        x: { ticks: { color: MUTED, font: { size: 8 }, maxRotation: 38, minRotation: 38, autoSkip: false },
             grid: { display: false } },
        y: { ticks: { color: MUTED, font: { size: 8 }, callback: v => v + 'h' },
             grid: { color: 'rgba(0,0,0,0.05)' }, beginAtZero: true },
      },
    },
  }));
}

function ring(id, pct, text, colour) {
  const el = document.getElementById(id);
  if (!el) return;
  const value = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
  const centre = {
    id: 'c' + id,
    afterDraw(c) {
      const x = c.ctx, a = c.chartArea;
      x.save();
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillStyle = '#243547';
      x.font = '500 15px Arial';
      x.fillText(text, (a.left + a.right) / 2, (a.top + a.bottom) / 2);
      x.restore();
    },
  };
  charts.push(new Chart(el, {
    type: 'doughnut',
    data: { datasets: [{ data: [value, 100 - value], backgroundColor: [colour, '#e8eaee'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '74%',
               plugins: { legend: { display: false }, tooltip: { enabled: false } } },
    plugins: [centre],
  }));
}

load();
</script>

</body>
</html>
